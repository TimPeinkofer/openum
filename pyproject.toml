[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openum"
version = "1.0"
description = "A simple Python library for numerical mathematical calculations and its utility functions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Tim Peinkofer", email = "tim.peinkofer@student.uni-tuebingen.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/TimPeinkofer/openum"
Bug-Tracker = "https://github.com/TimPeinkofer/openum/issues"
