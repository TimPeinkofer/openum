[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "NumKit" # Muss auf PyPI einzigartig sein!
version = "0.9.5"
authors = [
  { name="Tim Peinkofer", email="tim.peinkofer@student.uni-tuebingen.de" },
]
description = "Numerical calculation Kit"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
